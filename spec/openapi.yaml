    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Analytics]
      summary: Get demand, stay-shape, gap-night, and returning-guest analytics.
      parameters:
        - in: query
          name: from
          description: Inclusive period start in the property timezone; defaults to one year ago.
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Exclusive period end in the property timezone; defaults to today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Demand analytics for the selected period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsDemandResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /properties/{id}/analytics/pace:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Analytics]
      summary: Get cumulative booking pace for an arrival month.
      parameters:
        - in: query
          name: window
          description: Arrival month; defaults to the current month in the property timezone.
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
      responses:
        "200":
          description: Booking pace for the selected month and, when available, the prior year.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsPaceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /properties/{id}/analytics/returning-guests:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Analytics]
      summary: List returning guests for a date range.
      parameters:
        - in: query
          name: from
          description: Inclusive period start in the property timezone; defaults to one year ago.
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Exclusive period end in the property timezone; defaults to today.
          schema: { type: string, format: date }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated returning guests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsReturningGuestsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /properties/{id}/analytics/guest-checkin-heatmap:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [Analytics]
      summary: Get first guest unlock counts by local hour of day.
      parameters:
        - in: query
          name: from
          description: Inclusive range start; defaults to the first day of the current month in the property timezone.
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Inclusive range end; defaults to the last day of the current month in the property timezone.
          schema: { type: string, format: date }
      responses:
        "200":
          description: A 24-bucket guest check-in histogram.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsGuestCheckinHeatmapResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /properties/{id}/analytics/guest-checkin/reconcile/run:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    post:
      tags: [Analytics]
      summary: Reconcile Nuki guest entry events for analytics.
      parameters:
        - in: query
          name: month
          description: Optional month whose first day replaces the default 45-day reconciliation lookback.
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
      responses:
        "200":
          description: "Reconciliation result; service failures are returned with `ok: false`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsGuestReconcileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /admin/backup:
    get: *route-read

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: pms_session

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    StayIdPath:
      in: path
      name: stayId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ExternalIdPath:
      in: path
      name: externalId
      required: true
      schema: { type: string, minLength: 1 }
    CodeIdPath:
      in: path
      name: codeId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    EventIdPath:
      in: path
      name: eventId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TransactionIdPath:
      in: path
      name: transactionId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    RuleIdPath:
      in: path
      name: ruleId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    InvoiceIdPath:
      in: path
      name: invoiceId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TemplateIdPath:
      in: path
      name: templateId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    MonthPath:
      in: path
      name: month
      required: true
      schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
    MonthQuery:
      in: query
      name: month
      required: true
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}$"

  responses:
    BadRequest:
      description: Invalid request payload.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Caller lacks permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Request conflicts with current calendar state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    HealthStatus:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        reason: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Optional machine-readable code.

    ActionResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }

    AnalyticsFreshnessResponse:
      type: object
      required: [generated_at, unmatched_payouts_count, has_statement_data, staleness_level]
      properties:
        generated_at: { type: string, format: date-time }
        last_ics_sync_at: { type: string, format: date-time }
        last_payout_date: { type: string, format: date }
        last_statement_date: { type: string, format: date }
        unmatched_payouts_count: { type: integer }
        has_statement_data: { type: boolean }
        staleness_level: { type: string, enum: [ok, warn, stale] }

    AnalyticsKPIWindow:
      type: object
      required: [days, nights_sold, available_nights, confirmed_cents, estimated_cents, total_revenue_cents]
      properties:
        days: { type: integer }
        nights_sold: { type: integer }
        available_nights: { type: integer }
        confirmed_cents: { type: integer, format: int64 }
        estimated_cents: { type: integer, format: int64 }
        total_revenue_cents: { type: integer, format: int64 }

    AnalyticsPacePoint:
      type: object
      required: [date, count]
      properties:
        date: { type: string }
        count: { type: integer }

    AnalyticsUnsoldNight:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        prev_guest: { type: string }
        next_guest: { type: string }

    AnalyticsCountByDay:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer }

    AnalyticsOutlookResponse:
      type: object
      required: [generated_at, windows, pacing_series, unsold_nights, new_bookings, trailing_adr_cents]
      properties:
        generated_at: { type: string, format: date-time }
        windows:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsKPIWindow" }
        pacing_series:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPacePoint" }
        unsold_nights:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsUnsoldNight" }
        new_bookings:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsCountByDay" }
        revenue_as_of: { type: string, format: date }
        trailing_adr_cents: { type: integer, format: int64 }

    AnalyticsPerformanceKPIs:
      type: object
      required:
        [nights_sold, available_nights, occupancy_rate, adr_cents, revpar_cents, gross_cents, net_cents, commission_cents, payment_fees_cents, effective_take_rate, matched_nights, availability_nights, availability_occupancy, guest_nights, guest_occupancy]
      properties:
        nights_sold: { type: integer }
        available_nights: { type: integer }
        occupancy_rate: { type: number, format: double }
        adr_cents: { type: integer, format: int64 }
        revpar_cents: { type: integer, format: int64 }
        gross_cents: { type: integer, format: int64 }
        net_cents: { type: integer, format: int64 }
        commission_cents: { type: integer, format: int64 }
        payment_fees_cents: { type: integer, format: int64 }
        effective_take_rate: { type: number, format: double }
        matched_nights: { type: integer }
        availability_nights: { type: integer }
        availability_occupancy: { type: number, format: double }
        guest_nights: { type: integer }
        guest_occupancy: { type: number, format: double }

    AnalyticsMonthlyTrendRow:
      type: object
      required: [month, occupancy_rate, adr_cents, gross_cents, nights_sold, available_nights]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        occupancy_rate: { type: number, format: double }
        adr_cents: { type: integer, format: int64 }
        gross_cents: { type: integer, format: int64 }
        nights_sold: { type: integer }
        available_nights: { type: integer }

    AnalyticsHeatmapCell:
      type: object
      required: [year, week, occupancy_rate]
      properties:
        year: { type: integer }
        week: { type: integer }
        occupancy_rate: { type: number, format: double }

    AnalyticsDOWCell:
      type: object
      required: [dow, nights_sold, available_nights, occupancy_rate]
      properties:
        dow: { type: integer }
        nights_sold: { type: integer }
        available_nights: { type: integer }
        occupancy_rate: { type: number, format: double }

    AnalyticsBucket:
      type: object
      required: [bucket, count]
      properties:
        bucket: { type: string }
        count: { type: integer }

    AnalyticsCancellationStat:
      type: object
      required: [rate, buckets, total_active_plus_cancelled, total_cancelled]
      properties:
        rate: { type: number, format: double }
        buckets:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsBucket" }
        total_active_plus_cancelled: { type: integer }
        total_cancelled: { type: integer }

    AnalyticsCancellationCohortRow:
      type: object
      required: [month, rate, cancelled, active, other]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        rate: { type: number, format: double }
        cancelled: { type: integer }
        active: { type: integer }
        other: { type: integer }

    AnalyticsCommissionTrendRow:
      type: object
      required: [month, rate, commission_cents, gross_cents, stays]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        rate: { type: number, format: double }
        commission_cents: { type: integer, format: int64 }
        gross_cents: { type: integer, format: int64 }
        stays: { type: integer }

    AnalyticsCommissionPerStayRow:
      type: object
      required: [booking_id, reference, guest_name, check_in_date, check_out_date, gross_cents, commission_cents, rate]
      properties:
        booking_id: { type: integer, format: int64 }
        reference: { type: string }
        guest_name: { type: string }
        check_in_date: { type: string, format: date }
        check_out_date: { type: string, format: date }
        gross_cents: { type: integer, format: int64 }
        commission_cents: { type: integer, format: int64 }
        rate: { type: number, format: double }

    AnalyticsNetPerStayRow:
      type: object
      required: [stay_id, start_at, end_at, guest_name, gross_cents, commission_cents, payment_fee_cents, cleaning_allocated_cents, net_cents]
      properties:
        stay_id: { type: integer, format: int64 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        guest_name: { type: string }
        gross_cents: { type: integer, format: int64 }
        commission_cents: { type: integer, format: int64 }
        payment_fee_cents: { type: integer, format: int64 }
        cleaning_allocated_cents: { type: integer, format: int64 }
        net_cents: { type: integer, format: int64 }

    AnalyticsYearlyCleaningRow:
      type: object
      required: [month, count]
      properties:
        month: { type: integer }
        count: { type: integer }

    AnalyticsYearlyCleaningBlock:
      type: object
      required: [year, series]
      properties:
        year: { type: integer }
        series:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsYearlyCleaningRow" }

    AnalyticsYearlyFinanceBlock:
      type: object
      required: [year, incoming_cents, outgoing_cents, net_cents]
      properties:
        year: { type: integer }
        incoming_cents: { type: integer, format: int64 }
        outgoing_cents: { type: integer, format: int64 }
        net_cents: { type: integer, format: int64 }

    AnalyticsPerformanceResponse:
      type: object
      required:
        [generated_at, from, to, kpis, monthly_trend, seasonality_heatmap, dow_occupancy, cancellation, cancellation_by_booking_month, cancellation_by_arrival_month, commission_rate_trend, commission_per_stay, has_statement_data, net_per_stay, yearly_cleaning, yearly_finance]
      properties:
        generated_at: { type: string, format: date-time }
        from: { type: string, format: date }
        to: { type: string, format: date }
        kpis: { $ref: "#/components/schemas/AnalyticsPerformanceKPIs" }
        prior_kpis: { $ref: "#/components/schemas/AnalyticsPerformanceKPIs" }
        monthly_trend:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsMonthlyTrendRow" }
        seasonality_heatmap:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsHeatmapCell" }
        dow_occupancy:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsDOWCell" }
        cancellation: { $ref: "#/components/schemas/AnalyticsCancellationStat" }
        cancellation_by_booking_month:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsCancellationCohortRow" }
        cancellation_by_arrival_month:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsCancellationCohortRow" }
        commission_rate_trend:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsCommissionTrendRow" }
        commission_per_stay:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsCommissionPerStayRow" }
        has_statement_data: { type: boolean }
        net_per_stay:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsNetPerStayRow" }
        yearly_cleaning: { $ref: "#/components/schemas/AnalyticsYearlyCleaningBlock" }
        yearly_finance: { $ref: "#/components/schemas/AnalyticsYearlyFinanceBlock" }
        revenue_as_of: { type: string, format: date }

    AnalyticsPersonsBucket:
      type: object
      required: [persons, stays, gross_cents, room_nights, adr_cents]
      properties:
        persons: { type: integer }
        stays: { type: integer }
        gross_cents: { type: integer, format: int64 }
        room_nights: { type: integer }
        adr_cents: { type: integer, format: int64 }

    AnalyticsADRRow:
      type: object
      required: [bucket, adr_cents, matched_nights]
      properties:
        bucket: { type: string }
        adr_cents: { type: integer, format: int64 }
        matched_nights: { type: integer }

    AnalyticsGapRow:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        prev_stay_id: { type: integer, format: int64 }
        next_stay_id: { type: integer, format: int64 }
        prev_checkout_date: { type: string, format: date }
        next_checkin_date: { type: string, format: date }

    AnalyticsReturningStat:
      type: object
      required: [total_active, returning, returning_rate]
      properties:
        total_active: { type: integer }
        returning: { type: integer }
        returning_rate: { type: number, format: double }

    AnalyticsDemandResponse:
      type: object
      required:
        [generated_at, from, to, lead_time, lead_time_statement, length_of_stay, persons_distribution, adr_by_month, adr_by_dow, adr_by_lead_bucket, adr_by_persons, gap_nights, orphan_midweek, returning_guests, has_statement_data]
      properties:
        generated_at: { type: string, format: date-time }
        from: { type: string, format: date }
        to: { type: string, format: date }
        lead_time:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsBucket" }
        lead_time_statement:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsBucket" }
        length_of_stay:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsBucket" }
        persons_distribution:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsPersonsBucket" }
        adr_by_month:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsADRRow" }
        adr_by_dow:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsADRRow" }
        adr_by_lead_bucket:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsADRRow" }
        adr_by_persons:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsADRRow" }
        gap_nights:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsGapRow" }
        orphan_midweek:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AnalyticsGapRow" }
        returning_guests: { $ref: "#/components/schemas/AnalyticsReturningStat" }
        has_statement_data: { type: boolean }

    AnalyticsReturningGuest:
      type: object
      required: [display_name, normalized, stay_count, first_stay, last_stay]
      properties:
        display_name: { type: string }
        normalized: { type: string }
        stay_count: { type: integer }
        first_stay: { type: string, format: date-time }
        last_stay: { type: string, format: date-time }

    AnalyticsReturningGuestsResponse:
      type: object
      required: [generated_at, total, limit, offset, guests]
      properties:
        generated_at: { type: string, format: date-time }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        guests:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsReturningGuest" }

    AnalyticsPaceResponse:
      type: object
      required: [generated_at, window, this_year, ly_available]
      properties:
        generated_at: { type: string, format: date-time }
        window: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        this_year:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPacePoint" }
        last_year:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPacePoint" }
        ly_available: { type: boolean }

    AnalyticsGuestCheckinHourBucket:
      type: object
      required: [hour, count]
      properties:
        hour: { type: integer, minimum: 0, maximum: 23 }
        count: { type: integer }

    AnalyticsGuestCheckinHeatmapResponse:
      type: object
      required: [from, to, buckets]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        buckets:
          type: array
          minItems: 24
          maxItems: 24
          items: { $ref: "#/components/schemas/AnalyticsGuestCheckinHourBucket" }

    AnalyticsGuestReconcileStats:
      type: object
      required: [fetched_events, cleaner_skipped, auth_matched_events, entry_like_events, upserted_days, fallback_any_event, named_stay_key_count, cleaner_alias_count, requested_since_utc]
      properties:
        fetched_events: { type: integer }
        cleaner_skipped: { type: integer }
        auth_matched_events: { type: integer }
        entry_like_events: { type: integer }
        upserted_days: { type: integer }
        fallback_any_event: { type: boolean }
        named_stay_key_count: { type: integer }
        cleaner_alias_count: { type: integer }
        requested_since_utc: { type: string, format: date-time }

    AnalyticsGuestReconcileResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        stats: { $ref: "#/components/schemas/AnalyticsGuestReconcileStats" }

    OccupancySource:
      type: object
      required: [property_id, source_type, active]
      properties:
        property_id: { type: integer, format: int64 }
        source_type: { type: string }
        active: { type: boolean }

    OccupancySourceResponse:
      type: object
      required: [source]
      properties:
        source: { $ref: "#/components/schemas/OccupancySource" }

    OccupancySourcePatchRequest:
      type: object
      additionalProperties: false
      properties:
        active: { type: boolean }
        source_type: { type: string }

    OccupancySyncRunsResponse:
      type: object
      required: [runs, page, limit, has_more]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/OccupancySyncRun" }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        has_more: { type: boolean }

    OccupancySyncRun:
      type: object
      required:
        - id
        - started_at
        - status
        - events_seen
        - trigger
        - raw_blocks_inserted
        - raw_blocks_updated
        - raw_blocks_unchanged
        - raw_blocks_deleted_from_source
        - raw_block_conflicts
      properties:
        id: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        status: { type: string }
