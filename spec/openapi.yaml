          { type: string, enum: [not_applicable, pending, generated, error] }
        nuki_generation_error: { type: string }
        covered_nights:
          type: array
          items: { type: string, format: date }
        source_links:
          type: array
          items: { $ref: "#/components/schemas/StaySourceLink" }
        cleaning_events:
          type: array
          items: { $ref: "#/components/schemas/CalendarCleaningEvent" }

