          type: array
          items: { $ref: "#/components/schemas/AvailabilityBlock" }

    RawBookingBlock:
      type: object
      required:
        [
          id,
          property_id,
          source_type,
          source_event_uid,
          check_in_date,
          check_out_date,
          status,
          covered_nights,
          cleaning_events,
        ]
      properties:
        id: { type: integer, format: int64 }
        property_id: { type: integer, format: int64 }
        source_type: { type: string, enum: [booking_ics] }
        source_event_uid: { type: string }
        check_in_date: { type: string, format: date }
        check_out_date: { type: string, format: date }
        status: { type: string, enum: [active, deleted_from_source, conflict] }
        raw_summary: { type: string }
        source_dtstamp: { type: string }
        last_sync_run_id: { type: integer, format: int64 }
        conflict_reason: { type: string }
        covered_nights:
          type: array
          items: { type: string, format: date }
        cleaning_events:
          type: array
          items: { $ref: "#/components/schemas/CalendarCleaningEvent" }

    NamedStay:
      type: object
      required:
        [
          id,
          property_id,
          display_name,
          stay_type,
          check_in_date,
          check_out_date,
          status,
          cleaning_required,
          review_status,
          counts_as_sold,
          has_finance_evidence,
          nuki_generation_status,
          covered_nights,
          source_links,
          cleaning_events,
        ]
      properties:
        id: { type: integer, format: int64 }
        property_id: { type: integer, format: int64 }
        display_name: { type: string }
        stay_type:
          {
            type: string,
            enum: [booking_com, external, maintenance, personal_use],
          }
        check_in_date: { type: string, format: date }
        check_out_date: { type: string, format: date }
